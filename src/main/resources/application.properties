spring.application.name=faturas
spring.main.banner-mode=off
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# Resolução com que o PDF é desenhado para procurar o QR (300 é seguro; 200 é mais rápido)
faturas.render-dpi=300

# NIF -> nome do fornecedor
faturas.fornecedores.502030712=Makro
faturas.fornecedores.502897279=Recheio
faturas.fornecedores.516526782=Docapeixe

# O conjunto de faturas carregadas vive na sessão (em memória, nunca em disco)
server.servlet.session.timeout=2h


cloudflare.api.token=${CLOUDFLARE_API_TOKEN:}
cloudflare.account.id=${CLOUDFLARE_ACCOUNT_ID:9f6d45a7ad8211e1efc329eb444576bb}
cloudflare.d1.database.id=${CLOUDFLARE_DATABASE_ID:f3fa106f-e675-4b7e-94b3-c720d10b7f94}